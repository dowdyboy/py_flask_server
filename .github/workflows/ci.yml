name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest tests/ --cov=flask_server --cov=wsgi --cov-report=term --cov-fail-under=85

  test-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_URI: mysql+pymysql://root:root@127.0.0.1:3306/testdb?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests against real MySQL
        run: pytest tests/test_sqlalchemy_integration.py tests/test_sqlite.py -v

  # 真实 Redis：Streams / GETDEL / XAUTOCLAIM / XPENDING 这些语义只有连真 Redis 才验证得到。
  # 其余用例全走 FakeRedis 替身，替身与真实实现的差异恰恰是 bug 藏身之处，
  # 因此 tests/test_redis_live.py 由 REDIS_URL 驱动、单独一个 job 跑。
  test-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Assert Redis service answers
        # service 的 healthcheck 通过不代表 127.0.0.1:6379 可用（端口映射/容器没起来的
        # 情况下 pytest 只会报"连接失败"，信息不直观），这里先自己 PING 一次。
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python - <<'EOF'
          import os
          import sys
          import time

          import redis

          url = os.environ['REDIS_URL']
          last = None
          for _ in range(30):
              try:
                  client = redis.Redis.from_url(url, socket_connect_timeout=1, socket_timeout=1)
                  print(f'REDIS PING {url} -> {client.ping()}')
                  client.close()
                  sys.exit(0)
              except Exception as e:  # noqa: BLE001
                  last = e
                  time.sleep(1)
          print(f'::error::Redis 服务不可用（{url}）：{last}')
          sys.exit(1)
          EOF
      - name: Run live-Redis tests
        # 只跑标了 redis_live 的用例（文件不存在或 marker 丢失都会直接失败，不做容错）；
        # RATE_LIMIT_STORE=redis 保证至少有一条用例走真实 Redis 限流存储（而非内存兜底）
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
          RATE_LIMIT_STORE: redis
        run: python -m pytest tests/test_redis_live.py -m redis_live -q --strict-markers

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        shell: bash
        run: pytest tests/ --cov=flask_server --cov=wsgi --cov-report=term --cov-fail-under=85

  # 用 constraints.txt 锁定版本跑一遍：保证"镜像里装的版本"也被测试过
  test-locked-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt -r requirements-dev.txt
      - name: Show resolved versions
        run: pip list --format=freeze | sort | head -40
      - name: Run tests with coverage
        run: pytest tests/ --cov=flask_server --cov=wsgi --cov-report=term --cov-fail-under=85

  # 多进程真实冒烟：单测覆盖不到"每个 worker 都抢绑协议端口"这类问题
  # （gunicorn 不支持 Windows，只能在 Linux 上验证）
  test-gunicorn-multiprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt -r requirements-dev.txt
      - name: Install gunicorn
        run: pip install "gunicorn>=23.0.0,<24.0"
      - name: Multi-worker smoke
        # 校验：WORKER_NUM=2 + TCP_ENABLED=true 时协议服务器被跳过且所有 worker 存活；
        #       WORKER_NUM=1 时协议服务器正常监听并能回显；SIGTERM 后 master 退出码为 0
        run: |
          set -o pipefail
          python scripts/smoke_gunicorn.py 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Surface smoke failure as annotation
        # 失败时把日志尾部转成 ::error:: 注解：job 日志接口需要 token，
        # 而 check-run annotation 可公开读取，便于在没有仓库权限的环境里定位原因
        if: failure()
        run: |
          tail -c 3000 "$RUNNER_TEMP/smoke.log" | tr '\n' ' ' | sed 's/%/%25/g' > "$RUNNER_TEMP/smoke.tail"
          echo "::error::$(cat "$RUNNER_TEMP/smoke.tail")"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.16.0,<1.0"
      - name: Ruff check
        run: ruff check flask_server/ tests/ examples/ scripts/ _e2e/ server.py wsgi.py wsgi_gunicorn.py

  # 静态类型检查（渐进式门禁）：只覆盖 flask_server/，配置见 pyproject.toml 的 [tool.mypy]
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy>=2.0.0,<3.0"
      - name: mypy
        run: mypy

  deps-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirements.txt matches pyproject.toml
        run: |
          python - <<'EOF'
          import tomllib

          req = set()
          for line in open('requirements.txt', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              req.add(line)
          with open('pyproject.toml', 'rb') as f:
              deps = set(tomllib.load(f)['project']['dependencies'])
          missing = deps - req
          extra = req - deps
          assert not missing and not extra, (
              f'依赖清单不一致: 仅 pyproject: {sorted(missing)}, 仅 requirements: {sorted(extra)}'
          )
          print(f'deps in sync: {len(deps)} packages')
          EOF

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install "pip-audit>=2.7,<3.0"
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-server:ci .
      - name: Show image size
        run: "docker images flask-server:ci --format 'image size: {{.Size}}'"
      - name: Verify image boots
        run: |
          docker run -d --name flask-server-smoke -p 5000:5000 flask-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/v1/healthz >/dev/null 2>&1; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker logs flask-server-smoke
          exit 1
