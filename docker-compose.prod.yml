# 生产环境编排（示例）：app（waitress）+ MySQL + Redis
# 用法：
#   cp .env.example .env   # 修改 SECRET_KEY / 数据库密码等
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# 与开发版 docker-compose.yml 的差异：
#   - app 使用 waitress WSGI 服务器（python wsgi.py）
#   - MySQL/Redis 不暴露宿主端口（仅内网互通），更安全
#   - server.log 挂载到宿主便于日志采集
# 生产部署前必须设置：SECRET_KEY、MYSQL_PASSWORD、MYSQL_ROOT_PASSWORD

services:
  app:
    build: .
    command: ["python", "wsgi.py"]
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      APP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SQLALCHEMY_URI: mysql+pymysql://app:${MYSQL_PASSWORD:-apppass}@mysql:3306/appdb?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DB_REFLECT_ON_START: "false"
      # 显式写文件日志：production 预设 log_to_console=False，不设此项时 app 只会得到
      # Logger.init 的兜底控制台 handler。配合下面 ./server.log 的 bind mount，
      # 让宿主能直接采集日志文件。
      LOG_FILE_PATH: /app/server.log
      # Docker 网络下客户端请求经网关（172.x）进入容器：信任网关网段以解析真实 IP（限流/日志用）。
      # ⚠️ 注意：信任整个 CIDR 意味着该网段内任意容器都能伪造 X-Forwarded-For（可绕过限流），
      #    请确保网络内仅含可信服务；如严格隔离可改为具体网关 IP（docker network inspect 查看）。
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./storage:/app/storage
      - ./webui:/app/webui
      # 注意：仅当容器内设置了 LOG_FILE_PATH=/app/server.log（见上方 environment）时，
      # 这个挂载才有采集意义。若宿主上不存在 ./server.log，Docker 会把挂载点建成目录。
      - ./server.log:/app/server.log
    restart: unless-stopped
    # PID 1 用 tini 回收僵尸进程；wsgi.py 的 GRACEFUL_TIMEOUT=15s，
    # stop_grace_period 必须大于它，否则 Docker 会在 drain 完成前 SIGKILL
    init: true
    stop_grace_period: 25s

  # 任务队列消费者（独立进程，与 app 分开扩容/重启）
  # 默认不启动（tasks 为空时 worker 会以退出码 1 结束，避免 up 之后反复重启）：
  #   docker-compose -f docker-compose.prod.yml --profile worker up -d --build
  # 需要先在本机 flask_server/task/ 下定义任务；REDIS_URL 必须配置（内存队列跨进程不可见）
  worker:
    build: .
    command: ["python", "scripts/worker.py", "--concurrency", "4"]
    profiles: ["worker"]
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SQLALCHEMY_URI: mysql+pymysql://app:${MYSQL_PASSWORD:-apppass}@mysql:3306/appdb?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DB_REFLECT_ON_START: "false"
      LOG_FILE_PATH: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # PID 1 用 tini 回收僵尸进程（worker 会起子任务线程/子进程）
    init: true
    # 收到 SIGTERM 后不再取新任务、等在途任务跑完；长任务请调大
    stop_grace_period: 60s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # REDIS_PASSWORD 为空时不传 --requirepass（redis-server 拒绝空密码，直接启动失败）；
    # 设置后自动启用认证。⚠️ 密码含 shell 特殊字符（空格/$/引号）时此写法不适用，请改用 secrets
    command: >-
      sh -c 'if [ -n "${REDIS_PASSWORD:-}" ]; then
      exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}";
      else exec redis-server --appendonly yes; fi'
    volumes:
      - redis_data:/data
    healthcheck:
      # 认证开启时 redis-cli ping 会返回 NOAUTH（非 PONG），健康检查需带密码；
      # 未设置 REDIS_PASSWORD 时条件展开为空（等价裸 ping）
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"${REDIS_PASSWORD}\"} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
