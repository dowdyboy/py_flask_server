name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest tests/ --cov=flask_server --cov-report=term --cov-fail-under=85

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_URI: mysql+pymysql://root:root@127.0.0.1:3306/testdb?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests against real MySQL
        run: pytest tests/test_sqlalchemy_integration.py tests/test_sqlite.py -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests with coverage
        shell: bash
        run: pytest tests/ --cov=flask_server --cov-report=term --cov-fail-under=85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check flask_server/ tests/ examples/ scripts/ server.py wsgi.py wsgi_gunicorn.py

  deps-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirements.txt matches pyproject.toml
        run: |
          python - <<'EOF'
          import tomllib

          req = set()
          for line in open('requirements.txt', encoding='utf-8'):
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              req.add(line)
          with open('pyproject.toml', 'rb') as f:
              deps = set(tomllib.load(f)['project']['dependencies'])
          missing = deps - req
          extra = req - deps
          assert not missing and not extra, (
              f'依赖清单不一致: 仅 pyproject: {sorted(missing)}, 仅 requirements: {sorted(extra)}'
          )
          print(f'deps in sync: {len(deps)} packages')
          EOF

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t flask-server:ci .
      - name: Show image size
        run: "docker images flask-server:ci --format 'image size: {{.Size}}'"
      - name: Verify image boots
        run: |
          docker run -d --name flask-server-smoke -p 5000:5000 flask-server:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/v1/healthz >/dev/null 2>&1; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container failed to become healthy"
          docker logs flask-server-smoke
          exit 1
