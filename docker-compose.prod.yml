# 生产环境编排（示例）：app（waitress）+ MySQL + Redis
# 用法：
#   cp .env.example .env   # 修改 SECRET_KEY / 数据库密码等
#   docker-compose -f docker-compose.prod.yml up -d --build
#
# 与开发版 docker-compose.yml 的差异：
#   - app 使用 waitress WSGI 服务器（python wsgi.py）
#   - MySQL/Redis 不暴露宿主端口（仅内网互通），更安全
#   - server.log 挂载到宿主便于日志采集
# 生产部署前必须设置：SECRET_KEY、MYSQL_PASSWORD、MYSQL_ROOT_PASSWORD

services:
  app:
    build: .
    command: ["python", "wsgi.py"]
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      APP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SQLALCHEMY_URI: mysql+pymysql://app:${MYSQL_PASSWORD:-apppass}@mysql:3306/appdb?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DB_REFLECT_ON_START: "false"
      # Docker 网络下客户端请求经网关（172.x）进入容器：信任网关网段以解析真实 IP（限流/日志用）。
      # ⚠️ 注意：信任整个 CIDR 意味着该网段内任意容器都能伪造 X-Forwarded-For（可绕过限流），
      #    请确保网络内仅含可信服务；如严格隔离可改为具体网关 IP（docker network inspect 查看）。
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./storage:/app/storage
      - ./webui:/app/webui
      - ./server.log:/app/server.log
    restart: unless-stopped
    stop_grace_period: 15s

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
