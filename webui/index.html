<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        body { background: #0f3460; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { max-width: 640px; width: 100%; }
        h1 { font-size: 2.4rem; font-weight: 300; margin-bottom: 8px; }
        h1 span { color: #4cc9f0; font-weight: 700; }
        .subtitle { color: #a0a0c0; margin-bottom: 32px; font-size: 1rem; }
        .endpoints { display: flex; flex-direction: column; gap: 12px; }
        .endpoint { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: rgba(255,255,255,0.05); border-radius: 10px; text-decoration: none; color: #f0f0f0; transition: background 0.2s; }
        .endpoint:hover { background: rgba(255,255,255,0.1); }
        .method { font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 4px; min-width: 56px; text-align: center; }
        .get { background: #2ecc71; color: #fff; }
        .post { background: #e67e22; color: #fff; }
        .path { font-family: 'Consolas', monospace; font-size: 0.95rem; }
        .desc { color: #8888aa; font-size: 0.85rem; margin-left: auto; }
        footer { margin-top: 32px; text-align: center; color: #555577; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flask <span>Server</span></h1>
        <p class="subtitle">脚手架已就绪，以下是可用端点：</p>
        <div class="endpoints">
            <a class="endpoint" href="/hello"><span class="method get">GET</span><span class="path">/hello</span><span class="desc">最简示例</span></a>
            <a class="endpoint" href="/api/v1/health"><span class="method get">GET</span><span class="path">/api/v1/health</span><span class="desc">健康检查</span></a>
            <a class="endpoint" href="/docs"><span class="method get">GET</span><span class="path">/docs</span><span class="desc">API 文档 (Swagger UI)</span></a>
            <a class="endpoint" href="/openapi.json"><span class="method get">GET</span><span class="path">/openapi.json</span><span class="desc">OpenAPI Schema</span></a>
        </div>
        <footer>Flask Server Scaffold &mdash; 修改 webui/index.html 替换此页面</footer>
    </div>
</body>
</html>
