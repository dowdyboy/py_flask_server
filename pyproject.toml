[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-server"
version = "0.3.0"
description = "A production-grade Flask web service scaffold with layered architecture"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Flask>=3.1.2,<4.0",
    "flask-cors>=6.0.2,<7.0",
    "Flask-SQLAlchemy>=3.1.1,<4.0",
    "flask-migrate>=4.0.0,<5.0",
    "flask-smorest>=0.42.0,<1.0",
    "marshmallow>=3.21.0,<4.0",
    "requests>=2.32.5,<3.0",
    "Werkzeug>=3.1.5,<4.0",
    "PyMySQL>=1.1.2,<2.0",
    "waitress>=3.0.2,<4.0",
    "MarkupSafe>=3.0.3,<4.0",
    "redis>=5.0.0,<6.0",
    "python-dotenv>=1.0.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["flask_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["flask_server"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_lines = [
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

# 刻意设计豁免：
# - flask_server/__init__.py：import * 聚合导出工具/模块（加载顺序机制）
# - flask_server/model/__init__.py：同上
# - flask_server/app.py：eventlet monkey_patch 必须先于 socket 相关导入（E402）
[tool.ruff.lint.per-file-ignores]
"flask_server/__init__.py" = ["F403"]
"flask_server/model/__init__.py" = ["F403"]
"flask_server/app.py" = ["E402"]
