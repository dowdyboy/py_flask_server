services:
  app:
    build: .
    # 开发入口：覆盖镜像默认（生产 waitress）为 Flask 开发服务器（debug + reloader）
    command: ["python", "server.py"]
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      APP_ENV: development
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SQLALCHEMY_URI: mysql+pymysql://app:apppass@mysql:3306/appdb?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      # Docker 网络下客户端请求经网关（172.x）进入容器：信任网关网段以解析真实 IP（限流/日志用）。
      # ⚠️ 注意：信任整个 CIDR 意味着该网段内任意容器都能伪造 X-Forwarded-For（可绕过限流），
      #    请确保网络内仅含可信服务；如严格隔离可改为具体网关 IP（docker network inspect 查看）。
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v1/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./storage:/app/storage
      - ./webui:/app/webui
      # 注意：未挂载代码目录（./:/app）——Werkzeug reloader 监听的是容器内 /app，
      # 宿主上的代码编辑不会触发热更新；仅 storage/webui 的改动可热生效。
      # 需要代码热更新时追加挂载：- ./flask_server:/app/flask_server
    restart: unless-stopped
    stop_grace_period: 10s

  mysql:
    image: mysql:8.0
    # 注意：以下密码为模板示例，生产环境请通过 .env 或 Docker secrets 注入，勿硬编码
    environment:
      MYSQL_DATABASE: appdb
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
