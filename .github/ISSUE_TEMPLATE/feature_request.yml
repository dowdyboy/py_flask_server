name: 功能建议
description: 提新功能或改进建议（不涉及安全漏洞）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue / PR，避免重复。建议聚焦"要解决的问题"，方案可以留白。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在哪里不好用 / 缺什么能力？尽量给出实际场景。
      placeholder: 多进程部署时 ... 需要手工 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望怎么用？接口/配置项/行为大概是什么样？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在是怎么绕过的？有哪些权衡？
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      description: 主要改动落在哪一块？
      options:
        - 核心框架（flask_server/）
        - 配置与文档（.env.example / docs/）
        - 部署编排（Docker / deployments/）
        - CI 与工程化（.github/ / Makefile / _e2e/）
        - 脚手架生成（scripts/scaffold.py）
        - 其它（在补充说明里写）
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考实现、相关 Issue、兼容性考虑等
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 Issue，确认没有重复
          required: true
        - label: 这不是安全漏洞（安全问题走 SECURITY.md 的私密渠道）
          required: true
