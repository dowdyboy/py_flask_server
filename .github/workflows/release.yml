name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # 发布前先跑一遍与 CI 相同的快速检查：代码/依赖坏了不该因为"推了个 tag"就变成 Release
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest tests/ -q

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag format
        # 只接受 v<major>.<minor>.<patch>，可带预发布后缀（如 v0.7.0-rc.1）；
        # 用 $GITHUB_REF_NAME 而不是表达式插值，避免 tag 里的引号/分号进入 shell
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?$'; then
            echo "::error::标签 $TAG 格式不合法：要求 v<major>.<minor>.<patch>（可带 -rc.1 之类的预发布后缀）"
            exit 1
          fi
          echo "标签格式校验通过：$TAG"
      - name: Extract changelog section
        id: changelog
        # 从 CHANGELOG.md 提取对应版本段落；提取为空直接失败，
        # 避免"tag 发了、Release 正文是空的"。
        run: |
          python - "$GITHUB_REF_NAME" <<'EOF'
          import re
          import sys

          version = sys.argv[1].lstrip('v')
          with open('CHANGELOG.md', encoding='utf-8') as f:
              content = f.read()
          match = re.search(
              rf'^## \[{re.escape(version)}\] - .*?$(.*?)(?=^## |\Z)',
              content, re.MULTILINE | re.DOTALL)
          body = match.group(1).strip() if match else ''
          if not body:
              print(f'::error::CHANGELOG.md 中找不到版本 {version} 的发布说明；'
                    f'请添加 "## [{version}] - <日期>" 小节并填写内容后再打 tag')
              sys.exit(1)
          with open('release_body.md', 'w', encoding='utf-8') as f:
              f.write(body)
          print(f'已提取 {version} 的 CHANGELOG 段落（{len(body)} 字符）')
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: false
